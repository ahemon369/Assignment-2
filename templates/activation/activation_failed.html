{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow border-danger">
            <div class="card-body py-5">
                <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Activation Failed</h3>
                <p class="text-muted">The activation link is invalid or has expired.</p>
                <a href="{% url 'signup' %}" class="btn btn-primary mt-2">Sign Up Again</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
